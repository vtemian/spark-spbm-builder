name: Build packages

# A push to main is a release: it uploads to the PPA. Prose changes must not
# spend a version number, so they are excluded here.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.series }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # noble only. DGX OS 7 is Ubuntu 24.04, so that is the only series a
        # Spark runs. jammy was tried and is actively harmful: it has no
        # dh-dkms package, so its build sits in Dependency wait forever, and a
        # second series re-uploads a regenerated .orig.tar.gz that Launchpad
        # rejects for differing from the one it already accepted.
        series: [noble]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-dkms dpkg-dev lintian

      - name: Build the binary package
        run: make deb BUILD_DIST=${{ matrix.series }}

      - name: Check it with lintian
        run: lintian build/*.deb || true

      - name: Confirm DKMS registration actually landed
        run: |
          set -euo pipefail
          deb=$(ls build/*.deb | head -1)
          dpkg-deb -c "$deb" | grep -q 'usr/src/spbm-' \
            || { echo "source not shipped to /usr/src"; exit 1; }
          dpkg-deb -e "$deb" /tmp/ctrl
          grep -q dkms /tmp/ctrl/postinst \
            || { echo "dh_dkms did not add maintainer scripts"; exit 1; }
          echo "package registers with DKMS"

      # Launchpad refuses any binary holding a file dated before 1975, and it
      # checks *after* building: the build goes green, the upload dies, and the
      # only trace is "Failed to upload" with the reason buried in the upload
      # log. Catching it here keeps that failure inside a pull request.
      - name: Reject timestamps Launchpad will not accept
        run: |
          set -euo pipefail
          deb=$(ls build/*.deb | head -1)
          old=$(dpkg-deb -c "$deb" | awk '$4 < "1975-01-01"')
          if [ -n "$old" ]; then
            echo "$old"
            echo "files predate 1975; Launchpad would reject this upload"
            exit 1
          fi
          echo "all file timestamps are acceptable to Launchpad"

      - uses: actions/upload-artifact@v4
        with:
          name: spbm-dkms-${{ matrix.series }}
          path: build/*.deb

  # Uploads to ppa:vladtemian/spark-spbm on pushes to main. Upstream
  # (antheas/spark_hwmon) declares MODULE_LICENSE("GPL") in spbm.c but ships no
  # LICENSE file; a PR adding the matching text is open at
  # https://github.com/antheas/spark_hwmon/pull/1. See debian-spbm/copyright.
  ppa:
    name: upload to PPA
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        series: [noble]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-dkms dput-ng

      # Same shape as gitfs-builder's, which is the version known to work:
      # debuild needs a non-interactive agent, so loopback pinentry and an
      # ownertrust entry are both required or signing hangs in CI.
      - name: Import the signing key
        env:
          PGP_KEY: ${{ secrets.PGP_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'use-agent\npinentry-mode loopback\nallow-freeform-uid\n' > ~/.gnupg/gpg.conf
          printf 'allow-loopback-pinentry\n' > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          printf '%s' "$PGP_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          echo "$FPR:6:" | gpg --import-ownertrust
          echo "GPG_KEY_ID=$FPR" >> "$GITHUB_ENV"

      - name: Build and upload the source package
        env:
          DEBEMAIL: vladtemian@gmail.com
          DEBFULLNAME: Vlad Temian
          GNUPGHOME: /home/runner/.gnupg
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          make source BUILD_DIST=${{ matrix.series }}
          dput ppa:vladtemian/spark-spbm build/*_source.changes
